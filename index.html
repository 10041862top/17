<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Apply 控制台 | 全自動補助與競賽輔助系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/umd/lucide.min.js"></script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="sidebar-header">
                <i data-lucide="zap" class="logo-icon"></i>
                <span>AI Apply Console</span>
            </div>
            
            <div class="sidebar-nav">
                <div class="nav-group">
                    <div class="nav-title">政府補助計畫</div>
                    <a href="#" class="nav-item active" data-id="sbir">
                        <i data-lucide="landmark"></i> 經濟部 SBIR
                    </a>
                    <a href="#" class="nav-item" data-id="ai-plus">
                        <i data-lucide="microchip"></i> 經濟部 AI+ 計畫
                    </a>
                    <a href="#" class="nav-item" data-id="digiplus">
                        <i data-lucide="cloud"></i> DIGITAL+ 創新補助
                    </a>
                    <a href="#" class="nav-item" data-id="siir">
                        <i data-lucide="store"></i> SIIR 服務業創新
                    </a>
                </div>

                <div class="nav-group">
                    <div class="nav-title">競賽與新創</div>
                    <a href="#" class="nav-item" data-id="startup">
                        <i data-lucide="trophy"></i> 台灣新創競技場
                    </a>
                </div>

                <div class="nav-group">
                    <div class="nav-title">政府採購標案</div>
                    <a href="#" class="nav-item" data-id="tender">
                        <i data-lucide="briefcase"></i> 政府電子採購網
                    </a>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <a href="https://github.com/10041862top/17" target="_blank" class="btn-primary-sm" style="width: 100%; text-align: center; display: block;">
                    <i data-lucide="github"></i> GitHub Repo
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1 id="project-title" class="gradient-text">經濟部 SBIR 中小企業創新研發計畫</h1>
                <div class="status-badge" id="project-status"><span class="dot green"></span> 就緒</div>
            </header>

            <div class="action-panel glass">
                <div class="action-header">
                    <h2><i data-lucide="cpu"></i> AI 自動化控制面板</h2>
                    <p>請依序點擊下方按鈕，執行全自動申請流程。</p>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" id="btn-research">
                        <i data-lucide="search"></i>
                        <span>啟動調研分析</span>
                    </button>
                    <button class="action-btn" id="btn-write" disabled>
                        <i data-lucide="pen-tool"></i>
                        <span>產出申請文件</span>
                    </button>
                    <button class="action-btn" id="btn-fill" disabled>
                        <i data-lucide="play-circle"></i>
                        <span>執行自動填表</span>
                    </button>
                </div>
            </div>

            <div class="results-container">
                <!-- Research View -->
                <div class="result-view" id="view-research" style="display: none;">
                    <div class="view-header">
                        <h3><i data-lucide="bar-chart-2"></i> 深度調研與競品分析結果</h3>
                        <div class="timestamp">AI 生成於 <span class="current-time"></span></div>
                    </div>
                    <div class="view-body" id="content-research">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <!-- Writing View -->
                <div class="result-view" id="view-write" style="display: none;">
                    <div class="view-header">
                        <h3><i data-lucide="file-text"></i> AI 智慧文件撰寫預覽</h3>
                        <div class="timestamp">AI 生成於 <span class="current-time"></span></div>
                    </div>
                    <div class="view-body document-preview" id="content-write">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <!-- Fill View -->
                <div class="result-view" id="view-fill" style="display: none;">
                    <div class="view-header">
                        <h3><i data-lucide="terminal"></i> 自動化腳本執行監控</h3>
                    </div>
                    <div class="view-body">
                        <div class="code-window mock-terminal">
                            <div class="window-header">
                                <span class="dot red"></span>
                                <span class="dot yellow"></span>
                                <span class="dot green"></span>
                            </div>
                            <div class="window-body">
                                <pre><code id="content-fill"></code></pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
